[package]
name = "kinetix-kernel"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Freestanding 64-bit operating system kernel for Kinetix OS"

[dependencies]
kinetix-boot-protocol = { path = "../../crates/kinetix-boot-protocol" }
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions"] }
spin = { version = "0.12.3", default-features = false, features = ["mutex", "spin_mutex", "once"] }

